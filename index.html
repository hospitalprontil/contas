<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRONTIL - Plano de Contas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <div class="max-w-5xl mx-auto p-4 md:p-8">
        <header class="mb-8">
            <h1 class="text-2xl font-bold text-blue-900">Plano de Contas - Hospital PRONTIL:</h1>
            <p class="text-slate-600">Classifique notas em lote ou tire dúvidas sobre o plano de contas.</p>
        </header>

        <div class="grid md:grid-cols-2 gap-8">
            <!-- Coluna Esquerda: Classificador -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex gap-4 mb-6 border-b border-slate-200">
                    <button id="btnTabLote" onclick="switchMode('lote')" class="pb-2 px-2 font-medium text-blue-600 border-b-2 border-blue-600">Classificar em Lote</button>
                    <button id="btnTabDuvida" onclick="switchMode('duvida')" class="pb-2 px-2 font-medium text-slate-500 hover:text-blue-600">Dúvida / Texto Livre</button>
                </div>

                <label id="labelInput" class="block text-sm font-semibold mb-2">Itens ou Notas (um por linha):</label>
                <textarea id="inputDescricao" class="w-full h-48 p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none mb-4" placeholder="Seringa 10ml..."></textarea>
                
                <button id="btnEnviar" onclick="processar()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition">Executar</button>

                <div id="resultadoContainer" class="hidden mt-6 p-4 bg-slate-100 rounded-xl border border-slate-200 max-h-96 overflow-y-auto">
                    <h3 class="font-bold text-lg mb-2">Resultados:</h3>
                    <div id="resultadoIA" class="text-slate-700 space-y-4"></div>
                </div>
            </div>

            <!-- Coluna Direita: Plano de Contas -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="font-bold text-lg mb-4 text-blue-900">Plano de Contas</h2>
                <div id="planoContas" class="space-y-2 max-h-[500px] overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://prontil-api.onrender.com/api/gemini';
        let modoAtual = 'lote';

        const planoDeContas = [
                       { modulo: "MÓDULO 1 – MEDICAMENTOS", contas: ["1.1 Antibióticos e Antimicrobianos", "1.2 Anestésicos, Sedativos e Controlados", "1.3 Psicotrópicos / Controlados", "1.4 Soluções Parenterais, Diluentes e Eletrólitos", "1.5 Gases Medicinais", "1.6 Cardiovasculares e Respiratórios", "1.7 Medicamentos Especiais, Alto Custo e Imunobiológicos", "1.8 Endócrino / Hematologia", "1.9 Gastrointestinais", "1.10 Medicamentos de Uso Geral e Sintomáticos", "1.11 Medicamentos Tópicos e Cuidados de Pele", "1.12 Não Padronizados"] },
            { modulo: "MÓDULO 2 – MATERIAL HOSPITALAR", contas: ["2.1 Descartáveis / Alto Giro Assistencial", "2.2 Acessórios de Equipamentos Médicos", "2.3 Materiais Respiratórios, Aspiração e Cateteres", "2.4 OPME", "2.5 Insumos de Esterilização e Consumíveis de CME", "2.6 Testes Rápidos / Reagentes / Kits de Laboratório", "2.7 Bens Duráveis de Pequeno Valor", "2.8 Curativos, Coberturas e Hemostáticos", "2.9 Fios Cirúrgicos", "2.10 Materiais Cirúrgicos", "2.11 Materiais de Infusão e Acesso Vascular", "2.12 Sondas Diversas"] },
            { modulo: "MÓDULO 3 – NUTRIÇÃO / SND", contas: ["3.1 Dietas e Suplementos Industrializados", "3.2 Gêneros Alimentícios (Perecíveis e Secos / Cozinha e Refeitório)", "3.3 Utensílios de Cozinha e Refeitório", "3.4 Descartáveis e Embalagens de Cozinha"] },
            { modulo: "MÓDULO 4 – INFRAESTRUTURA E MANUTENÇÃO", contas: ["4.1 Peças e Componentes de Reposição para Equipamentos Médicos", "4.2 Peças e Conexões de Reposição Predial Diária", "4.3 Materiais de Construção e Acabamento", "4.4 Insumos e Materiais de Apoio à Infraestrutura", "4.5 Ferramentas e Utensílios Manuais", "4.6 Combustíveis, Aditivos e Óleos Lubrificantes"] },
            { modulo: "MÓDULO 5 – HIGIENE, HOTELARIA E ADM", contas: ["5.1 Materiais de Limpeza, Higienização e Saneantes Hospitalares", "5.2 Enxoval, Encapamentos e Hotelaria de Leito", "5.3 Brinquedoteca, Humanização e Recreação", "5.4 Material de Escritório e Apoio Operacional", "5.5 Impressos Padronizados e Formulários", "5.6 Consumo de Apoio e Copa Geral", "5.7 Material de Informática"] },
            { modulo: "MÓDULO 6 – PESSOAL, ENCARGOS E RH", contas: ["6.1 Uniformes, Enxoval Profissional e Vestuários", "6.2 EPIs", "6.3 Benefícios de Pessoal", "6.4 Eventos e Programas Institucionais", "6.5 Folha de Pagamento, Encargos Sociais e Obrigações Trabalhistas", "6.6 Treinamento, Educação Continuada e Desenvolvimento", "6.7 Medicina e Segurança do Trabalho"] },
            { modulo: "MÓDULO 7 – SERVIÇOS DE TERCEIROS", contas: ["7.1 Corpo Clínico e Honorários Médicos", "7.2 Serviços Assistenciais Terceirizados", "7.3 Serviços de Apoio Logístico / Hoteleiro", "7.4 Contratos de Equipamentos, Manutenção e Calibração", "7.5 Serviços de Pequenos Reparos e Consertos Prediais Diários", "7.6 Mão de Obra de Engenharia, Reformas Estruturais e Empreitadas", "7.7 Sistemas de Gestão, Licenças de Software", "7.8 Utilidades Básicas e Telecomunicações", "7.9 Marketing, Publicidade e Comunicação", "7.10 Recrutamento, Seleção e Mão de Obra Temporária", "7.11 Serviços Administrativos e Profissionais Especializados", "7.12 Serviços Diagnósticos Externos"] },
            { modulo: "MÓDULO 8 – INVESTIMENTOS / CAPEX", contas: ["8.1 Equipamentos Médicos e Hospitalares", "8.2 Instrumental Cirúrgico Reutilizável e Caixas Cirúrgicas", "8.3 Mobiliário, Utensílios e Infraestrutura Não Assistencial", "8.4 T.I. e Hardware", "8.5 Infraestrutura Predial e Obras"] },
            { modulo: "MÓDULO 9 – FINANCEIRO, TRIBUTÁRIO E SOCIETÁRIO", contas: ["9.1 Despesas Financeiras", "9.2 Empréstimos e Financiamentos", "9.3 Tributos e Obrigações Governamentais", "9.4 Retenções Tributárias", "9.5 Seguros Corporativos", "9.6 Eventos Societários e Distribuição de Resultados", "9.7 Contingências, Processos e Acordos Judiciais", "9.8 Ajustes Contábeis e Exceções"] }
        ];

        function switchMode(modo) {
            modoAtual = modo;
            const btnLote = document.getElementById('btnTabLote');
            const btnDuv = document.getElementById('btnTabDuvida');
            const label = document.getElementById('labelInput');
            const textarea = document.getElementById('inputDescricao');

            if(modo === 'lote') {
                btnLote.className = "pb-2 px-2 font-medium text-blue-600 border-b-2 border-blue-600";
                btnDuv.className = "pb-2 px-2 font-medium text-slate-500 hover:text-blue-600";
                label.innerText = "Itens ou Notas (um por linha):";
                textarea.placeholder = "Seringa 10ml\nGaze estéril\nLuva de procedimento...";
            } else {
                btnDuv.className = "pb-2 px-2 font-medium text-blue-600 border-b-2 border-blue-600";
                btnLote.className = "pb-2 px-2 font-medium text-slate-500 hover:text-blue-600";
                label.innerText = "Descreva sua dúvida:";
                textarea.placeholder = "Ex: Onde devo classificar um serviço de limpeza de ar condicionado?";
            }
        }

        async function processar() {
            const input = document.getElementById('inputDescricao').value.trim();
            const resDiv = document.getElementById('resultadoIA');
            const container = document.getElementById('resultadoContainer');

            if (!input) return alert("Por favor, preencha o campo.");

            resDiv.innerHTML = "Processando...";
            container.classList.remove('hidden');

            let htmlResult = "";
            if (modoAtual === 'lote') {
                const linhas = input.split('\n').filter(l => l.trim() !== "");
                for (const item of linhas) {
                    htmlResult += await chamarAPI(item, 'classificacao');
                }
            } else {
                htmlResult = await chamarAPI(input, 'duvida');
            }
            resDiv.innerHTML = htmlResult;
        }

        async function chamarAPI(texto, tipo) {
            const planoStr = planoDeContas.map(m => `${m.modulo}: ${m.contas.join(', ')}`).join('\n');
            
            let instrucao = "";
            if (tipo === 'classificacao') {
                instrucao = `Você é um classificador contábil hospitalar. Classifique o item abaixo ESTRITAMENTE dentro do seguinte plano de contas:
                
                ${planoStr}
                
                Responda APENAS no formato:
                - **Módulo:** [Nome do Módulo]
                - **Conta:** [Nome da Conta]
                - **Justificativa:** [Breve justificativa técnica]
                - **Confiança:** [X%]

                Item: ${texto}`;
            } else {
                instrucao = `Você é um consultor contábil especializado no hospital. O colaborador tem a seguinte dúvida sobre o plano de contas: "${texto}".
                
                O plano de contas é:
                ${planoStr}
                
                Responda de forma clara, técnica e objetiva, e resumida, ajudando o colaborador a entender onde ele deve classificar o que ele precisa, mantendo a conformidade contábil, e sem mto texto descritivo, tem que ser bem pratico.`;
            }

            try {
                const payload = { contents: [{ parts: [{ text: instrucao }] }] };

                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    return `<div class="p-2 border-b text-red-600 text-sm"><strong>Erro:</strong> ${data.error?.message || "Erro"}</div>`;
                }

                const resposta = data.candidates?.[0]?.content?.parts?.[0]?.text || "IA não retornou resposta.";
                
                return `<div class="p-3 border-b bg-white rounded-lg shadow-sm mb-2 text-sm">${resposta.replace(/\n/g, '<br>')}</div>`;
            } catch (error) {
                return `<div class="p-2 border-b text-red-600 text-sm">Erro: ${error.message}</div>`;
            }
        }

        function renderPlano() {
            const container = document.getElementById('planoContas');
            planoDeContas.forEach((m, index) => {
                const div = document.createElement('div');
                div.className = "border rounded-lg mb-2 overflow-hidden";
                div.innerHTML = `
                    <button onclick="toggleModulo(${index})" class="w-full text-left p-3 bg-slate-50 font-semibold text-sm hover:bg-slate-100 flex justify-between">
                        ${m.modulo} <span>▼</span>
                    </button>
                    <div id="modulo-${index}" class="hidden p-3 bg-white border-t text-sm">
                        <ul class="list-disc pl-5 space-y-1">${m.contas.map(c => `<li>${c}</li>`).join('')}</ul>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function toggleModulo(index) {
            document.getElementById(`modulo-${index}`).classList.toggle('hidden');
        }

        renderPlano();
    </script>
</body>
</html>
