<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRONTIL - Plano de Contas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <div class="max-w-5xl mx-auto p-4 md:p-8">
        <header class="mb-8">
            <h1 class="text-2xl font-bold text-blue-900">Plano de Contas - Hospital PRONTIL</h1>
            <p class="text-slate-600">Classifique notas, tire dúvidas e revise itens sinalizados.</p>
        </header>

        <div class="grid md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex gap-4 mb-6 border-b border-slate-200 overflow-x-auto">
                    <button id="btnTabLote" onclick="switchMode('lote')" class="pb-2 px-2 font-medium text-blue-600 border-b-2 border-blue-600 whitespace-nowrap">Classificar Lote</button>
                    <button id="btnTabDuvida" onclick="switchMode('duvida')" class="pb-2 px-2 font-medium text-slate-500 hover:text-blue-600 whitespace-nowrap">Dúvida / IA</button>
                    <button id="btnTabSinal" onclick="switchMode('sinal')" class="pb-2 px-2 font-medium text-slate-500 hover:text-blue-600 whitespace-nowrap">Sinalizados</button>
                    <button id="btnTabHistorico" onclick="switchMode('historico')" class="pb-2 px-2 font-medium text-slate-500 hover:text-blue-600 whitespace-nowrap">Histórico</button>
                </div>

                <div id="containerLote">
                    <textarea id="inputDescricao" class="w-full h-48 p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none mb-4" placeholder="Cole os itens aqui (um por linha)..."></textarea>
                    <button onclick="processarLote()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition">Classificar</button>
                    <div id="resultadoContainerLote" class="hidden mt-6 p-4 bg-slate-100 rounded-xl border border-slate-200 max-h-[400px] overflow-y-auto">
                        <div id="resultadoIA" class="text-slate-700 text-sm space-y-3"></div>
                    </div>
                </div>

                <div id="containerChat" class="hidden">
                    <div id="chatHistory" class="h-96 overflow-y-auto mb-4 border p-4 bg-slate-50 rounded-xl text-sm space-y-3">
                        <div class="text-slate-500 italic text-center">Inicie uma conversa sobre o plano de contas...</div>
                    </div>
                    <div class="flex gap-2">
                        <input id="inputChat" type="text" class="flex-1 border rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Pergunte sobre o plano...">
                        <button onclick="enviarChat()" class="bg-blue-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-blue-700 transition">Enviar</button>
                    </div>
                </div>

                <div id="containerSinal" class="hidden">
                    <div id="listaSinalizados" class="h-96 overflow-y-auto space-y-3">
                        <p class="text-slate-500 italic text-center">Carregando sinalizados...</p>
                    </div>
                </div>

                <div id="containerHistorico" class="hidden">
                    <div id="listaHistorico" class="h-96 overflow-y-auto space-y-4 pr-2">
                        <p class="text-slate-500 italic text-center">Carregando histórico...</p>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="font-bold text-lg mb-4 text-blue-900">Plano de Contas</h2>
                <div id="planoContas" class="space-y-2 max-h-[500px] overflow-y-auto pr-2"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCDzbDhQ3Fgi_JzpCoUOcDokaSyohX1Qgs",
            authDomain: "plano-de-contas-8c8cd.firebaseapp.com",
            projectId: "plano-de-contas-8c8cd",
            storageBucket: "plano-de-contas-8c8cd.firebasestorage.app",
            messagingSenderId: "734002260923",
            appId: "1:734002260923:web:f5e457083c0e4bccdb729e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const BACKEND_URL = 'https://prontil-api.onrender.com/api/gemini';
        const cacheExemplos = {}; 
        
        const planoDeContas = [
            { modulo: "MÓDULO 1 – MEDICAMENTOS", contas: ["1.1 Antibióticos e Antimicrobianos", "1.2 Anestésicos, Sedativos e Controlados", "1.3 Psicotrópicos / Controlados", "1.4 Soluções Parenterais, Diluentes e Eletrólitos", "1.5 Gases Medicinais", "1.6 Cardiovasculares e Respiratórios", "1.7 Medicamentos Especiais, Alto Custo e Imunobiológicos", "1.8 Endócrino / Hematologia", "1.9 Gastrointestinais", "1.10 Medicamentos de Uso Geral e Sintomáticos", "1.11 Medicamentos Tópicos e Cuidados de Pele", "1.12 Não Padronizados"] },
            { modulo: "MÓDULO 2 – MATERIAL HOSPITALAR", contas: ["2.1 Descartáveis / Alto Giro Assistencial", "2.2 Acessórios de Equipamentos Médicos", "2.3 Materiais Respiratórios, Aspiração e Cateteres", "2.4 OPME", "2.5 Insumos de Esterilização e Consumíveis de CME", "2.6 Testes Rápidos / Reagentes / Kits de Laboratório", "2.7 Bens Duráveis de Pequeno Valor", "2.8 Curativos, Coberturas e Hemostáticos", "2.9 Fios Cirúrgicos", "2.10 Materiais Cirúrgicos", "2.11 Materiais de Infusão e Acesso Vascular", "2.12 Sondas Diversas", "2.13 Material Não Padrão", "2.14 EPI´s Assistenciais"] },
            { modulo: "MÓDULO 3 – NUTRIÇÃO / SND", contas: ["3.1 Dietas e Suplementos Industrializados", "3.2 Gêneros Alimentícios (Perecíveis e Secos / Cozinha e Refeitório)", "3.3 Utensílios de Cozinha e Refeitório", "3.4 Descartáveis e Embalagens de Cozinha"] },
            { modulo: "MÓDULO 4 – INFRAESTRUTURA E MANUTENÇÃO", contas: ["4.1 Peças e Componentes de Reposição para Equipamentos Médicos", "4.2 Peças e Conexões de Reposição Predial Diária", "4.3 Materiais de Construção e Acabamento", "4.4 Insumos e Materiais de Apoio à Infraestrutura", "4.5 Ferramentas e Utensílios Manuais", "4.6 Combustíveis, Aditivos e Óleos Lubrificantes"] },
            { modulo: "MÓDULO 5 – HIGIENE, HOTELARIA E ADM", contas: ["5.1 Materiais de Limpeza, Higienização e Saneantes Hospitalares", "5.2 Enxoval, Encapamentos e Hotelaria de Leito", "5.3 Brinquedoteca, Humanização e Recreação", "5.4 Material de Escritório e Apoio Operacional", "5.5 Impressos Padronizados e Formulários", "5.6 Consumo de Apoio e Copa Geral", "5.7 Material de Informática"] },
            { modulo: "MÓDULO 6 – PESSOAL, ENCARGOS E RH", contas: ["6.1 Uniformes, Enxoval Profissional e Vestuários", "6.2 EPIs", "6.3 Benefícios de Pessoal", "6.4 Eventos e Programas Institucionais", "6.5 Folha de Pagamento, Encargos Sociais e Obrigações Trabalhistas", "6.6 Treinamento, Educação Continuada e Desenvolvimento", "6.7 Medicina e Segurança do Trabalho"] },
            { modulo: "MÓDULO 7 – SERVIÇOS DE TERCEIROS", contas: ["7.1 Corpo Clínico e Honorários Médicos", "7.2 Serviços Assistenciais Terceirizados", "7.3 Serviços de Apoio Logístico / Hoteleiro", "7.4 Contratos de Equipamentos, Manutenção e Calibração", "7.5 Serviços de Pequenos Reparos e Consertos Prediais Diários", "7.6 Mão de Obra de Engenharia, Reformas Estruturais e Empreitadas", "7.7 Sistemas de Gestão, Licenças de Software", "7.8 Utilidades Básicas e Telecomunicações", "7.9 Marketing, Publicidade e Comunicação", "7.10 Recrutamento, Seleção e Mão de Obra Temporária", "7.11 Serviços Administrativos e Profissionais Especializados", "7.12 Serviços Diagnósticos Externos", "7.13 Locação de Equipamentos Médicos e Mobiliário Assistencial", "7.14 locação de Equipamentos de Tecnologia da Informação", "7.15 Locação de Mobiliário e Utensílios Administrativos/Gerais"] },
            { modulo: "MÓDULO 8 – INVESTIMENTOS / CAPEX", contas: ["8.1 Equipamentos Médicos e Hospitalares", "8.2 Instrumental Cirúrgico Reutilizável e Caixas Cirúrgicas", "8.3 Mobiliário, Utensílios e Infraestrutura Não Assistencial", "8.4 T.I. e Hardware", "8.5 Infraestrutura Predial e Obras"] },
            { modulo: "MÓDULO 9 – FINANCEIRO, TRIBUTÁRIO E SOCIETÁRIO", contas: ["9.1 Despesas Financeiras", "9.2 Empréstimos e Financiamentos", "9.3 Tributos e Obrigações Governamentais", "9.4 Retenções Tributárias", "9.5 Seguros Corporativos", "9.6 Eventos Societários e Distribuição de Resultados", "9.7 Contingências, Processos e Acordos Judiciais", "9.8 Ajustes Contábeis e Exceções"] }
        ];

        const planoStr = planoDeContas.map(m => `${m.modulo}: ${m.contas.join(', ')}`).join('\n');

        document.getElementById('inputChat').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') enviarChat();
        });

        function switchMode(modo) {
            document.getElementById('containerLote').classList.toggle('hidden', modo !== 'lote');
            document.getElementById('containerChat').classList.toggle('hidden', modo !== 'duvida');
            document.getElementById('containerSinal').classList.toggle('hidden', modo !== 'sinal');
            document.getElementById('containerHistorico').classList.toggle('hidden', modo !== 'historico');
            
            const activeClass = "pb-2 px-2 font-medium text-blue-600 border-b-2 border-blue-600 whitespace-nowrap";
            const inactiveClass = "pb-2 px-2 font-medium text-slate-500 hover:text-blue-600 whitespace-nowrap";
            
            document.getElementById('btnTabLote').className = modo === 'lote' ? activeClass : inactiveClass;
            document.getElementById('btnTabDuvida').className = modo === 'duvida' ? activeClass : inactiveClass;
            document.getElementById('btnTabSinal').className = modo === 'sinal' ? activeClass : inactiveClass;
            document.getElementById('btnTabHistorico').className = modo === 'historico' ? activeClass : inactiveClass;
            
            if(modo === 'sinal') carregarSinalizados();
            if(modo === 'historico') carregarHistorico();
        }

        async function saveForReview(btn, item, mod, con, desc) {
            try {
                btn.disabled = true; 
                btn.innerHTML = "✓";
                btn.classList.add("text-green-600");
                await db.collection("revisoes").add({ 
                    item, 
                    modulo: mod, 
                    conta: con, 
                    descricao: desc, 
                    data: new Date() 
                });
            } catch (error) {
                console.error("Erro ao salvar:", error);
                btn.disabled = false;
                btn.innerHTML = "🚩";
            }
        }

        async function removerSinalizado(id) {
            try {
                // Remove visualmente de imediato para melhor UX, depois processa
                document.getElementById(`sinal-${id}`).style.opacity = '0.5';
                await db.collection("revisoes").doc(id).delete();
                carregarSinalizados();
            } catch (error) {
                console.error("Erro ao remover:", error);
            }
        }

        async function carregarSinalizados() {
            const list = document.getElementById('listaSinalizados');
            list.innerHTML = "<p class='text-slate-500 italic text-center'>Carregando sinalizados...</p>";
            try {
                const snapshot = await db.collection("revisoes").orderBy("data", "desc").get();
                list.innerHTML = snapshot.empty ? "<p class='text-center text-slate-600'>Nenhum item sinalizado.</p>" : "";
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const id = doc.id;
                    list.innerHTML += `<div id="sinal-${id}" class="p-4 bg-white border rounded-xl shadow-sm text-sm flex justify-between items-center transition-opacity">
                        <div>
                            <p class="font-bold text-blue-900">${d.item}</p>
                            <p class="text-xs text-slate-500 mt-1">${d.modulo} | ${d.conta}</p>
                            ${d.descricao ? `<p class="text-xs text-slate-400 mt-1 italic">${d.descricao}</p>` : ''}
                        </div>
                        <button onclick="removerSinalizado('${id}')" class="ml-4 px-3 py-1 bg-green-50 text-green-700 border border-green-200 rounded hover:bg-green-100 transition-colors text-xs font-bold" title="Marcar como resolvido e remover">✓ Concluir</button>
                    </div>`;
                });
            } catch (error) {
                list.innerHTML = "<p class='text-red-500 text-center'>Erro ao carregar os dados.</p>";
            }
        }

        async function salvarNoHistorico(tipo, pergunta, resposta) {
            try {
                await db.collection("historico").add({
                    tipo: tipo, // 'lote' ou 'duvida'
                    pergunta: pergunta,
                    resposta: resposta,
                    data: new Date()
                });
            } catch (error) {
                console.error("Erro ao salvar no histórico:", error);
            }
        }

        async function carregarHistorico() {
            const list = document.getElementById('listaHistorico');
            list.innerHTML = "<p class='text-slate-500 italic text-center'>Buscando histórico...</p>";
            try {
                // Limita aos últimos 50 para não pesar a navegação
                const snapshot = await db.collection("historico").orderBy("data", "desc").limit(50).get();
                list.innerHTML = snapshot.empty ? "<p class='text-center text-slate-600'>Seu histórico está vazio.</p>" : "";
                
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const dataFormatada = d.data.toDate().toLocaleString('pt-BR');
                    const tipoLabel = d.tipo === 'lote' ? '<span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded">Lote</span>' : '<span class="bg-purple-100 text-purple-800 text-xs px-2 py-1 rounded">Dúvida</span>';
                    
                    list.innerHTML += `<div class="p-4 bg-white border border-slate-200 rounded-xl shadow-sm text-sm">
                        <div class="flex justify-between items-center mb-2">
                            ${tipoLabel}
                            <span class="text-xs text-slate-400">${dataFormatada}</span>
                        </div>
                        <p class="font-semibold text-slate-800 mb-2 border-l-2 border-slate-300 pl-2 line-clamp-2" title="${d.pergunta}">${d.pergunta}</p>
                        <div class="text-slate-600 bg-slate-50 p-2 rounded text-xs leading-relaxed max-h-32 overflow-y-auto">${d.resposta.replace(/\n/g, '<br>')}</div>
                    </div>`;
                });
            } catch (error) {
                list.innerHTML = "<p class='text-red-500 text-center'>Erro ao carregar o histórico.</p>";
            }
        }

        async function chamarAPI(pergunta, tipo) {
            let inst = "";
            if (tipo === 'lote') {
                inst = `Plano de Contas ESTRITO:\n${planoStr}\n\nClassifique cada linha usando APENAS as contas acima. RETORNE EXATAMENTE NESTE FORMATO: item ; modulo ; conta ; breve descrição ; % de acerto (ex: 95%). Não adicione nenhum outro texto, saudação ou explicação. Itens:\n${pergunta}`;
            } else if (tipo === 'exemplo') {
                inst = `Plano de Contas:\n${planoStr}\n\nListe 10 itens típicos que se enquadram ESTRITAMENTE na conta: "${pergunta}". Retorne apenas a lista.`;
            } else {
                inst = `Você é um consultor. Plano de Contas:\n${planoStr}\n\nResponda à dúvida: ${pergunta}`;
            }

            try {
                const r = await fetch(BACKEND_URL, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ contents: [{ parts: [{ text: inst }] }] }) 
                });
                
                if (!r.ok) throw new Error("Erro na resposta da API");
                const j = await r.json();
                return j.candidates?.[0]?.content?.parts?.[0]?.text || "Erro: Resposta vazia da IA.";
            } catch (error) {
                console.error("API Error:", error);
                return "Falha de comunicação com a inteligência artificial. Tente novamente.";
            }
        }

        async function processarLote() {
            const txt = document.getElementById('inputDescricao').value.trim();
            if (!txt) return;

            document.getElementById('resultadoContainerLote').classList.remove('hidden');
            const div = document.getElementById('resultadoIA');
            div.innerHTML = "Processando... Isso pode levar alguns segundos.";
            
            const resp = await chamarAPI(txt, 'lote');
            div.innerHTML = "";
            
            if (resp.startsWith("Falha de comunicação")) {
                div.innerHTML = `<p class="text-red-500">${resp}</p>`;
                return;
            }

            let formatadoHistorico = ""; // Para guardar string limpa pro histórico

            resp.split('\n').forEach(l => {
                if(!l.includes(';')) return;
                let [it, m, c, d, conf] = l.split(';').map(s => s ? s.trim() : '');
                
                const safeIt = it ? it.replace(/'/g, "\\'") : '';
                const safeM = m ? m.replace(/'/g, "\\'") : '';
                const safeC = c ? c.replace(/'/g, "\\'") : '';
                const safeD = d ? d.replace(/'/g, "\\'") : '';

                formatadoHistorico += `Item: ${it} | Módulo: ${m} | Conta: ${c} | Confiança: ${conf || 'N/A'}\n`;

                div.innerHTML += `
                <div class="bg-white p-3 border rounded-xl shadow-sm flex items-start justify-between">
                    <div>
                        <div class="font-bold text-slate-800">${it}</div>
                        <div class="text-xs text-blue-700 font-medium">${m} | ${c}</div>
                        ${d ? `<div class="text-xs text-slate-500 mt-1 italic">${d}</div>` : ''}
                        ${conf ? `<div class="text-xs font-bold mt-1 text-emerald-600">Precisão: ${conf}</div>` : ''}
                    </div>
                    <button onclick="saveForReview(this, '${safeIt}','${safeM}','${safeC}','${safeD}')" 
                            class="px-2 py-1 hover:bg-slate-100 rounded text-lg transition-colors" 
                            title="Sinalizar para revisão">🚩</button>
                </div>`;
            });
            
            if(div.innerHTML === "") {
                div.innerHTML = "<p class='text-slate-500'>A IA não conseguiu classificar com base no plano.</p>";
            } else {
                // Se deu certo, salva no histórico
                salvarNoHistorico('lote', txt, formatadoHistorico);
            }
        }

        async function enviarChat() {
            const input = document.getElementById('inputChat');
            const txt = input.value.trim();
            if (!txt) return;

            const h = document.getElementById('chatHistory');
            h.innerHTML += `<div class="bg-blue-600 text-white p-3 rounded-xl self-end ml-auto max-w-[85%]">${txt}</div>`;
            input.value = "";
            h.scrollTop = h.scrollHeight;

            const tempId = "msg-" + Date.now();
            h.innerHTML += `<div id="${tempId}" class="bg-slate-200 p-3 rounded-xl self-start max-w-[85%] text-slate-500 italic">Digitando...</div>`;
            h.scrollTop = h.scrollHeight;

            const res = await chamarAPI(txt, 'duvida');
            
            document.getElementById(tempId).outerHTML = `<div class="bg-slate-200 text-slate-800 p-3 rounded-xl self-start max-w-[85%] leading-relaxed">${res.replace(/\n/g, '<br>')}</div>`;
            h.scrollTop = h.scrollHeight;

            // Salva interação no Firebase
            if (!res.startsWith("Falha de comunicação")) {
                salvarNoHistorico('duvida', txt, res);
            }
        }

        async function toggleExemplos(conta) {
            const id = `exemplos-${conta.replace(/[^a-zA-Z0-9]/g, '_')}`;
            const div = document.getElementById(id);
            
            div.classList.toggle('hidden');
            
            if (!div.classList.contains('hidden') && !cacheExemplos[conta]) {
                div.innerHTML = "Buscando exemplos na IA...";
                const exemplos = await chamarAPI(conta, 'exemplo');
                cacheExemplos[conta] = exemplos;
                div.innerHTML = exemplos.replace(/\n/g, '<br>');
            }
        }

        function renderPlano() {
            const container = document.getElementById('planoContas');
            planoDeContas.forEach((m, index) => {
                const div = document.createElement('div');
                div.className = "border border-slate-200 rounded-xl mb-3 overflow-hidden shadow-sm";
                
                div.innerHTML = `
                    <button onclick="document.getElementById('modulo-${index}').classList.toggle('hidden')" class="w-full text-left p-4 bg-slate-50 font-bold text-sm text-blue-900 hover:bg-slate-100 flex justify-between items-center transition-colors">
                        ${m.modulo} <span class="text-xs">▼</span>
                    </button>
                    <div id="modulo-${index}" class="hidden p-4 bg-white border-t border-slate-100 text-sm">
                        <ul class="space-y-2">
                            ${m.contas.map(c => `
                                <li>
                                    <button onclick="toggleExemplos('${c.replace(/'/g, "\\'")}')" class="text-slate-700 hover:text-blue-600 w-full text-left font-medium transition-colors">
                                        • ${c}
                                    </button>
                                    <div id="exemplos-${c.replace(/[^a-zA-Z0-9]/g, '_')}" class="hidden pl-4 mt-2 text-slate-500 italic text-xs border-l-2 border-blue-200 ml-1 py-1 leading-relaxed"></div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
                container.appendChild(div);
            });
        }
        
        renderPlano();
    </script>
</body>
</html>
