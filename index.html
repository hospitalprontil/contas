<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRONTIL - Plano de Contas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <div class="max-w-5xl mx-auto p-4 md:p-8">
        <header class="mb-6 md:mb-8 text-center md:text-left">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-900">Plano de Contas - Hospital PRONTIL</h1>
            <p class="text-sm md:text-base text-slate-600 mt-1 md:mt-0">Classifique notas, tire dúvidas e revise itens sinalizados.</p>
        </header>

        <div class="grid md:grid-cols-2 gap-4 md:gap-8">
            <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200 h-[600px] md:h-[700px] flex flex-col">
                
                <div class="flex gap-2 md:gap-4 mb-4 md:mb-6 border-b border-slate-200 overflow-x-auto shrink-0 pb-1">
                    <button id="btnTabLote" onclick="switchMode('lote')" class="pb-2 px-2 text-sm md:text-base font-medium text-blue-600 border-b-2 border-blue-600 whitespace-nowrap transition-colors">Classificar Lote</button>
                    <button id="btnTabDuvida" onclick="switchMode('duvida')" class="pb-2 px-2 text-sm md:text-base font-medium text-slate-500 hover:text-blue-600 whitespace-nowrap transition-colors">Dúvida / IA</button>
                    <button id="btnTabSinal" onclick="switchMode('sinal')" class="pb-2 px-2 text-sm md:text-base font-medium text-slate-500 hover:text-blue-600 whitespace-nowrap transition-colors">Sinalizados</button>
                    <button id="btnTabHistorico" onclick="switchMode('historico')" class="pb-2 px-2 text-sm md:text-base font-medium text-slate-500 hover:text-blue-600 whitespace-nowrap transition-colors">Histórico</button>
                </div>

                <div id="containerLote" class="flex flex-col flex-1 min-h-0 pr-1 md:pr-2">
                    <textarea id="inputDescricao" class="w-full h-24 md:h-32 p-3 md:p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none mb-3 md:mb-4 shrink-0 resize-none text-sm md:text-base" placeholder="Cole os itens aqui (um por linha), com uma breve descrição ou um complemento / valor (ex.: tesoura pequena para escritorio, ou computador de 1500 reais. )"></textarea>
                    <button onclick="processarLote()" class="w-full bg-blue-600 text-white font-bold py-3 md:py-3 rounded-xl hover:bg-blue-700 transition shadow-sm shrink-0 text-sm md:text-base">Classificar Itens</button>
                    <div id="resultadoContainerLote" class="hidden mt-3 md:mt-4 p-3 md:p-4 bg-slate-50 rounded-xl border border-slate-200 flex-1 min-h-0 overflow-y-auto">
                        <div id="resultadoIA" class="text-slate-700 text-sm space-y-3"></div>
                    </div>
                </div>

                <div id="containerChat" class="hidden flex-col flex-1 min-h-0 pr-1 md:pr-2">
                    <div class="flex justify-end mb-2 shrink-0">
                        <button onclick="novoChat()" class="px-3 py-1.5 bg-slate-100 text-slate-700 hover:bg-slate-200 border border-slate-300 rounded-lg text-xs md:text-sm font-bold transition-colors shadow-sm flex items-center gap-1">
                            <span>💬</span> Novo Chat
                        </button>
                    </div>
                    <div id="chatHistory" class="flex-1 overflow-y-auto mb-3 md:mb-4 border p-3 md:p-4 bg-slate-50 rounded-xl text-sm space-y-4 shadow-inner min-h-0">
                        <div class="text-slate-500 italic text-center text-xs mt-2">Inicie uma conversa ou detalhe um item do lote...</div>
                    </div>
                    <div class="flex gap-2 shrink-0">
                        <textarea id="inputChat" rows="2" class="flex-1 border border-slate-300 rounded-xl p-2 md:p-3 outline-none focus:ring-2 focus:ring-blue-500 resize-none text-sm md:text-base" placeholder="Responda ou faça sua pergunta... (Enter para enviar)"></textarea>
                        <button onclick="enviarChat()" class="bg-blue-600 text-white px-4 md:px-6 rounded-xl font-bold hover:bg-blue-700 transition shadow-sm text-sm md:text-base">Enviar</button>
                    </div>
                </div>

                <div id="containerSinal" class="hidden flex-col flex-1 min-h-0 pr-1 md:pr-2">
                    <div id="listaSinalizados" class="flex-1 overflow-y-auto space-y-3 pr-1 md:pr-2 min-h-0">
                        <p class="text-slate-500 italic text-center mt-4">Carregando sinalizados...</p>
                    </div>
                </div>

                <div id="containerHistorico" class="hidden flex-col flex-1 min-h-0 pr-1 md:pr-2">
                    <div class="flex justify-between items-center mb-2 shrink-0">
                        <span class="text-xs text-slate-500 italic hidden sm:inline-block">Selecione para excluir</span>
                        <button onclick="excluirHistoricoSelecionado()" class="px-3 py-1.5 md:px-4 md:py-2 bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 rounded-xl text-xs md:text-sm font-bold transition-colors shadow-sm hidden ml-auto" id="btnExcluirHistorico">
                            🗑 Excluir Selecionados
                        </button>
                    </div>
                    <div id="listaHistorico" class="flex-1 overflow-y-auto space-y-3 md:space-y-4 pr-1 md:pr-2 min-h-0">
                        <p class="text-slate-500 italic text-center mt-4">Carregando histórico...</p>
                    </div>
                </div>
            </div>

            <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200 h-[500px] md:h-[700px] flex flex-col mt-4 md:mt-0">
                <h2 class="font-bold text-lg mb-3 md:mb-4 text-blue-900 shrink-0">Plano de Contas Estruturado</h2>
                <div id="planoContas" class="space-y-2 flex-1 overflow-y-auto pr-1 md:pr-2"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCDzbDhQ3Fgi_JzpCoUOcDokaSyohX1Qgs",
            authDomain: "plano-de-contas-8c8cd.firebaseapp.com",

        const planoDeContas = [

            { modulo: "MÓDULO 2 – MATERIAL HOSPITALAR", contas: ["2.1 Descartáveis / Alto Giro Assistencial", "2.2 Acessórios de Equipamentos Médicos", "2.3 Materiais Respiratórios, Aspiração e Cateteres", "2.4 OPME", "2.5 Insumos de Esterilização e Consumíveis de CME", "2.6 Testes Rápidos / Reagentes / Kits de Laboratório", "2.7 Bens Duráveis de Pequeno Valor", "2.8 Curativos, Coberturas e Hemostáticos", "2.9 Fios Cirúrgicos", "2.10 Materiais Cirúrgicos", "2.11 Materiais de Infusão e Acesso Vascular", "2.12 Sondas Diversas", "2.13 Material Não Padrão", "2.14 EPI´s Assistenciais"] },
            { modulo: "MÓDULO 3 – NUTRIÇÃO / SND", contas: ["3.1 Dietas e Suplementos Industrializados", "3.2 Gêneros Alimentícios (Perecíveis e Secos / Cozinha e Refeitório)", "3.3 Utensílios de Cozinha e Refeitório", "3.4 Descartáveis e Embalagens de Cozinha", "3.5 Gás de Cozinha", "3.6 Saneantes / Higienização - SND"] },
            { modulo: "MÓDULO 4 – INFRAESTRUTURA E MANUTENÇÃO", contas: ["4.1 Materiais de Manutenção", "4.2 Bens, Ferramentas e Utensílios de Pequeno Valor", "4.3 Combustíveis, Aditivos, Óleos e Lubrificantes", "4.4 Peças  e Componentes de Reposição para Equipamentos Médicos"] },
            { modulo: "MÓDULO 5 – HIGIENE, HOTELARIA E ADM", contas: ["5.1 Materiais de Limpeza, Higienização e Saneantes Hospitalares", "5.2 Enxoval, Encapamentos e Hotelaria de Leito", "5.3 Brinquedoteca, Humanização e Recreação", "5.4 Material de Escritório e Apoio Operacional (podem ser solicitados e/ou utilizados por outros setores)", "5.5 Impressos Padronizados e Formulários", "5.6 Descartáveis, Consumo de Apoio e Copa Geral", "5.7 Material de Informática", "5.8 Bens, Mobiliário ou Equipamentos de Pequeno Valor"] },
            { modulo: "MÓDULO 6 – PESSOAL, ENCARGOS E RH", contas: ["6.1 Uniformes, Enxoval Profissional e Vestuários", "6.2 EPIs de Segurança/Medicina do Trabalho", "6.3 Benefícios de Pessoal", "6.4 Eventos e Programas Institucionais", "6.5 Folha de Pagamento, Encargos Sociais e Obrigações Trabalhistas", "6.6 Treinamento, Educação Continuada e Desenvolvimento", "6.7 Medicina e Segurança do Trabalho"] },
            { modulo: "MÓDULO 7 – SERVIÇOS DE TERCEIROS", contas: ["7.1 Corpo Clínico e Honorários Médicos", "7.2 Serviços Assistenciais Terceirizados", "7.3 Serviços de Apoio Logístico / Hoteleiro", "7.4 Contratos de Equipamentos, Manutenção e Calibração", "7.5 Serviços de Pequenos Reparos, Consertos e Manutenção Predial", "7.6 Sistemas de Gestão, Licenças de Software", "7.7 Utilidades Básicas e Telecomunicações", "7.8 Marketing, Publicidade e Comunicação", "7.9 Recrutamento, Seleção e Mão de Obra Temporária", "7.10 Serviços Administrativos e Profissionais Especializados", "7.11 Serviços Diagnósticos Externos", "7.12 Locação de Equipamentos Médicos e Mobiliário Assistencial", "7.13 locação de Equipamentos de Tecnologia da Informação", "7.14 Locação de Mobiliário e Utensílios Administrativos/Gerais"] },
            { modulo: "MÓDULO 8 – INVESTIMENTOS / CAPEX", contas: ["8.1 Equipamentos Médicos e Hospitalares", "8.2 Instrumental Cirúrgico Reutilizável e Caixas Cirúrgicas", "8.3 Mobiliário, Utensílios e Infraestrutura Não Assistencial", "8.4 T.I. e Hardware", "8.5 Infraestrutura Predial e Obras", "8.6 Equipamentos de Manutenção"] },
            { modulo: "MÓDULO 9 – FINANCEIRO, TRIBUTÁRIO E SOCIETÁRIO", contas: ["9.1 Despesas Financeiras", "9.2 Empréstimos e Financiamentos", "9.3 Tributos e Obrigações Governamentais", "9.4 Retenções Tributárias", "9.5 Seguros Corporativos", "9.6 Eventos Societários e Distribuição de Resultados", "9.7 Contingências, Processos e Acordos Judiciais", "9.8 Ajustes Contábeis e Exceções", "9.9 Taxas, Licenças e Anuidades"] },
            ];

        const planoStr = planoDeContas.map(m => `${m.modulo}: ${m.contas.join(', ')}`).join('\n');

        document.getElementById('inputChat').addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); 
                enviarChat();
            }
        });

        function switchMode(modo) {
            const containers = ['containerLote', 'containerChat', 'containerSinal', 'containerHistorico'];
            const modos = ['lote', 'duvida', 'sinal', 'historico'];

            modos.forEach((m, index) => {
                const el = document.getElementById(containers[index]);
                if (modo === m) {
                    el.classList.remove('hidden');
                    el.classList.add('flex');
                } else {
                    el.classList.add('hidden');
                    el.classList.remove('flex');
                }
            });
            
            const activeClass = "pb-2 px-2 text-sm md:text-base font-medium text-blue-600 border-b-2 border-blue-600 whitespace-nowrap transition-colors";
            const inactiveClass = "pb-2 px-2 text-sm md:text-base font-medium text-slate-500 hover:text-blue-600 whitespace-nowrap transition-colors";
            
            document.getElementById('btnTabLote').className = modo === 'lote' ? activeClass : inactiveClass;
            document.getElementById('btnTabDuvida').className = modo === 'duvida' ? activeClass : inactiveClass;
            document.getElementById('btnTabSinal').className = modo === 'sinal' ? activeClass : inactiveClass;
            document.getElementById('btnTabHistorico').className = modo === 'historico' ? activeClass : inactiveClass;
            
            if(modo === 'sinal') carregarSinalizados();
            if(modo === 'historico') carregarHistorico();
        }

        async function saveForReview(btn, item, mod, con, desc) {
            try {
                btn.disabled = true; 
                btn.innerHTML = "✓ Reportado";
                btn.className = "flex items-center gap-1 px-2 py-1 bg-green-50 text-green-700 border border-green-200 rounded-md text-xs font-bold opacity-75 cursor-not-allowed";
                await db.collection("revisoes").add({ 
                    item, modulo: mod, conta: con, descricao: desc, data: new Date() 
                });
            } catch (error) {
                console.error("Erro ao salvar:", error);
                btn.disabled = false;
                btn.innerHTML = "<span>🚩</span> Reportar";
            }
        }

        async function removerSinalizado(id) {
            try {
                document.getElementById(`sinal-${id}`).style.opacity = '0.5';
                await db.collection("revisoes").doc(id).delete();
                carregarSinalizados();
            } catch (error) {
                console.error("Erro ao remover:", error);
            }
        }

        async function carregarSinalizados() {
            const list = document.getElementById('listaSinalizados');
            list.innerHTML = "<p class='text-slate-500 italic text-center mt-4'>Carregando sinalizados...</p>";
            try {
                const snapshot = await db.collection("revisoes").orderBy("data", "desc").get();
                list.innerHTML = snapshot.empty ? "<p class='text-center text-slate-600 mt-4'>Nenhum item sinalizado.</p>" : "";
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const id = doc.id;
                    list.innerHTML += `
                    <div id="sinal-${id}" class="p-3 md:p-4 bg-white border border-slate-200 rounded-xl shadow-sm text-sm flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 transition-opacity">
                        <div class="flex-1 pr-0 sm:pr-4">
                            <p class="font-bold text-blue-900 text-sm md:text-base">${d.item}</p>
                            <p class="text-[10px] md:text-xs text-blue-700 font-semibold mt-1">${d.modulo}</p>
                            <p class="text-[10px] md:text-xs text-slate-500 mt-1">${d.conta}</p>
                            ${d.descricao ? `<p class="text-[10px] md:text-xs text-slate-400 mt-2 italic border-l-2 border-slate-200 pl-2 line-clamp-2">${d.descricao}</p>` : ''}
                        </div>
                        <button onclick="removerSinalizado('${id}')" class="self-end sm:self-auto shrink-0 px-3 py-2 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-lg hover:bg-emerald-100 transition-colors text-xs font-bold shadow-sm">✓ Concluir</button>
                    </div>`;
                });
            } catch (error) {
                list.innerHTML = "<p class='text-red-500 text-center mt-4'>Erro ao carregar os dados.</p>";
            }
        }

        async function salvarNoHistorico(tipo, pergunta, resposta) {
            try {
                await db.collection("historico").add({ tipo, pergunta, resposta, data: new Date() });
            } catch (error) {
                console.error("Erro ao salvar no histórico:", error);
            }
        }

        async function carregarHistorico() {
            const list = document.getElementById('listaHistorico');
            const btnExcluir = document.getElementById('btnExcluirHistorico');
            if (btnExcluir) btnExcluir.classList.add('hidden'); 
            
            list.innerHTML = "<p class='text-slate-500 italic text-center mt-4'>Buscando histórico...</p>";
            try {
                const snapshot = await db.collection("historico").orderBy("data", "desc").limit(50).get();
                list.innerHTML = snapshot.empty ? "<p class='text-center text-slate-600 mt-4'>Seu histórico está vazio.</p>" : "";
                
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const id = doc.id;
                    const dataFormatada = d.data.toDate().toLocaleString('pt-BR');
                    const tipoLabel = d.tipo === 'lote' ? '<span class="bg-blue-100 text-blue-800 text-[10px] md:text-xs px-2 py-1 rounded font-semibold border border-blue-200">Lote</span>' : '<span class="bg-purple-100 text-purple-800 text-[10px] md:text-xs px-2 py-1 rounded font-semibold border border-purple-200">Chat</span>';
                    
                    list.innerHTML += `
                    <div class="p-3 md:p-4 bg-white border border-slate-200 rounded-xl shadow-sm relative transition-colors hover:border-blue-200">
                        <div class="absolute top-3 md:top-4 right-3 md:right-4">
                            <input type="checkbox" class="hist-checkbox w-4 h-4 md:w-5 md:h-5 text-blue-600 bg-slate-100 border-slate-300 rounded focus:ring-blue-500 cursor-pointer" value="${id}" onchange="toggleBtnExcluir()">
                        </div>
                        <div class="flex justify-between items-center mb-3 pr-8">
                            ${tipoLabel}
                            <span class="text-[10px] md:text-xs text-slate-400 font-medium">${dataFormatada}</span>
                        </div>
                        <p class="font-semibold text-sm md:text-base text-slate-800 mb-2 md:mb-3 border-l-2 border-blue-300 pl-2 line-clamp-2 bg-slate-50 py-1" title="${d.pergunta}">${d.pergunta}</p>
                        <div class="text-slate-600 text-xs md:text-sm leading-relaxed max-h-32 overflow-y-auto whitespace-pre-line">${d.resposta}</div>
                    </div>`;
                });
            } catch (error) {
                list.innerHTML = "<p class='text-red-500 text-center mt-4'>Erro ao carregar o histórico.</p>";
            }
        }

        function toggleBtnExcluir() {
            const checkados = document.querySelectorAll('.hist-checkbox:checked');
            const btnExcluir = document.getElementById('btnExcluirHistorico');
            if (checkados.length > 0) {
                btnExcluir.classList.remove('hidden');
                btnExcluir.innerText = `🗑 Excluir Selecionados (${checkados.length})`;
            } else {
                btnExcluir.classList.add('hidden');
            }
        }

        async function excluirHistoricoSelecionado() {
            const checkados = document.querySelectorAll('.hist-checkbox:checked');
            if (checkados.length === 0) return;

            const btnExcluir = document.getElementById('btnExcluirHistorico');
            btnExcluir.disabled = true;
            btnExcluir.innerText = "Excluindo...";

            try {
                const batch = db.batch();
                checkados.forEach(cb => {
                    const docRef = db.collection("historico").doc(cb.value);
                    batch.delete(docRef);
                });
                await batch.commit();
                
                btnExcluir.disabled = false; 
                carregarHistorico(); 
            } catch (error) {
                console.error("Erro ao excluir histórico:", error);
                btnExcluir.disabled = false;
                toggleBtnExcluir(); 
            }
        }

        async function chamarAPI(pergunta, tipo) {
            let inst = "";
            if (tipo === 'lote') {
                inst = `Plano de Contas ESTRITO:\n${planoStr}\n\nClassifique cada linha fornecida pelo usuário usando APENAS as contas acima. \nRegra absoluta de retorno: RETORNE EXATAMENTE NESTE FORMATO com itens separados por ponto e vírgula:\nitem ; NOME COMPLETO DO MÓDULO ; conta ; breve descrição da utilidade (máximo 3 linhas) ; % de acerto (ex: 95%).\n\nNÃO adicione texto antes ou depois. Se for mais de um item, coloque um item por linha. \nItens para classificar:\n${pergunta}`;
            } else if (tipo === 'exemplo') {
                inst = `Plano de Contas:\n${planoStr}\n\nListe 10 exemplos práticos e reais de itens que se enquadram ESTRITAMENTE na conta: "${pergunta}". Retorne apenas a lista numerada.`;
            } else {
                inst = `Você é um consultor analítico do Hospital PRONTIL. Plano de Contas:\n${planoStr}\n\nVocê está conversando com o usuário para ajudá-lo a classificar itens. Analise todo o histórico e contexto da conversa abaixo. Responda à última interação do usuário baseando-se estritamente no nosso plano de contas. Seja claro, técnico e objetivo.\n\nHISTÓRICO DA CONVERSA:\n${pergunta}`;
            }

            try {
                const r = await fetch(BACKEND_URL, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ contents: [{ parts: [{ text: inst }] }] }) 
                });
                
                if (!r.ok) throw new Error("Erro na API");
                const j = await r.json();
                return j.candidates?.[0]?.content?.parts?.[0]?.text || "Erro: Resposta vazia da IA.";
            } catch (error) {
                console.error("API Error:", error);
                return "Falha de comunicação com a inteligência artificial. Tente novamente.";
            }
        }

        async function processarLote() {
            const txt = document.getElementById('inputDescricao').value.trim();
            if (!txt) return;

            document.getElementById('resultadoContainerLote').classList.remove('hidden');
            const div = document.getElementById('resultadoIA');
            div.innerHTML = "<div class='flex items-center justify-center py-8 text-blue-600 font-medium'><span class='animate-pulse'>Analisando itens e cruzando com o plano de contas...</span></div>";
            
            const resp = await chamarAPI(txt, 'lote');
            div.innerHTML = "";
            
            if (resp.startsWith("Falha") || resp.startsWith("Erro")) {
                div.innerHTML = `<p class="text-red-500 font-medium">${resp}</p>`;
                return;
            }

            let formatoHistorico = ""; 

            resp.split('\n').forEach(l => {
                if(!l.includes(';')) return;
                let partes = l.split(';').map(s => s ? s.trim() : '');
                let [it, m, c, d, conf] = [partes[0]||'', partes[1]||'', partes[2]||'', partes[3]||'', partes[4]||''];
                
                const safeIt = it.replace(/'/g, "\\'");
                const safeM = m.replace(/'/g, "\\'");
                const safeC = c.replace(/'/g, "\\'");
                const safeD = d.replace(/'/g, "\\'");

                formatoHistorico += `Item: ${it} | Módulo: ${m} | Conta: ${c} | Confiança: ${conf}\n`;

                div.innerHTML += `
                <div class="bg-white p-3 md:p-4 border border-slate-200 rounded-xl shadow-sm flex flex-col gap-1 mb-3 transition-all hover:border-blue-300">
                    <div class="font-bold text-slate-800 text-sm md:text-base">${it}</div>
                    <div class="text-[10px] md:text-xs text-blue-800 font-bold uppercase tracking-wide mt-1">${m}</div>
                    <div class="text-xs md:text-sm text-blue-600 font-medium">${c}</div>
                    ${d ? `<div class="text-xs md:text-sm text-slate-600 mt-1 md:mt-2 italic max-h-24 overflow-y-auto whitespace-pre-line bg-slate-50 p-2 rounded-lg scrollbar-thin">${d}</div>` : ''}
                    
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mt-3 pt-3 border-t border-slate-100">
                        <div class="text-[10px] md:text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded border border-emerald-100 self-start sm:self-auto">Precisão: ${conf || 'N/A'}</div>
                        <div class="flex gap-2 self-end sm:self-auto flex-wrap justify-end">
                            <button onclick="levarParaDuvida('${safeIt}', '${safeM}', '${safeC}')" 
                                    class="flex items-center gap-1 px-2 py-1 md:px-3 md:py-1 bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200 rounded-md transition-colors text-[10px] md:text-xs font-bold" 
                                    title="Duvida desta classificação? Acione o assistente avançado">
                                <span>❓</span> Tirar Dúvida
                            </button>
                            <button onclick="saveForReview(this, '${safeIt}','${safeM}','${safeC}','${safeD}')" 
                                    class="flex items-center gap-1 px-2 py-1 md:px-3 md:py-1 bg-red-50 text-red-700 hover:bg-red-100 border border-red-200 rounded-md transition-colors text-[10px] md:text-xs font-bold" 
                                    title="Arquivar para análise posterior do setor">
                                <span>🚩</span> Reportar
                            </button>
                        </div>
                    </div>
                </div>`;
            });
            
            if(div.innerHTML === "") {
                div.innerHTML = "<p class='text-slate-500'>A IA não conseguiu formatar a resposta corretamente. Tente reformular a lista.</p>";
            } else {
                salvarNoHistorico('lote', txt, formatoHistorico);
            }
        }

        async function novoChat() {
            // Backup the chat array before clearing it to prevent race conditions
            const chatTemp = [...contextoChatTexto]; 
            contextoChatTexto = [];
            
            if (chatTemp.length > 0) {
                let primeiraPergunta = chatTemp.find(m => m.role === 'user')?.text || "Dúvida Geral sobre Plano de Contas";
                
                if (primeiraPergunta.includes("INSTRUÇÃO DE SISTEMA")) {
                     primeiraPergunta = "Revisão Detalhada de Item";
                } else if (primeiraPergunta.length > 60) {
                     primeiraPergunta = primeiraPergunta.substring(0, 60) + "...";
                }

                let logCompleto = chatTemp.map(msg => `**${msg.role === 'user' ? 'Usuário' : 'Consultor IA'}**:\n${msg.text}`).join('\n\n');
                
                await salvarNoHistorico('duvida', primeiraPergunta, logCompleto);
                
                if (!document.getElementById('containerHistorico').classList.contains('hidden')) {
                    carregarHistorico();
                }
            }
            
            const h = document.getElementById('chatHistory');
            h.innerHTML = `<div class="text-slate-500 italic text-center text-xs mt-2">Inicie uma conversa ou detalhe um item do lote...</div>`;
        }

        function levarParaDuvida(item, modulo, conta) {
            if (contextoChatTexto.length > 0) novoChat();

            switchMode('duvida');
            const h = document.getElementById('chatHistory');
            
            const instrucaoSistema = `[INSTRUÇÃO DE SISTEMA]\nO usuário deseja revisar a classificação do item "${item}". A sugestão inicial foi "${modulo} - ${conta}". \nPara ajudar, você deve descobrir:\n1. É serviço ou produto?\n2. Qual setor solicitou?\n3. Qual a utilidade prática?\n4. Qual o valor aproximado?\n\nREGRA ESTRITA: Faça APENAS UMA pergunta por vez. Espere a resposta do usuário antes de fazer a próxima. Se ainda tiver dúvidas após as 4 perguntas, faça perguntas extras. Quando tiver certeza, dê a classificação final baseada no plano de contas.`;
            contextoChatTexto.push({role: 'user', text: instrucaoSistema});
            
            const primeiraPerguntaText = `📋 Análise de Refinamento: ${item}\nPara chegarmos à classificação perfeita, vamos por partes.\nPrimeiro: este item é um serviço ou um produto material?`;
            contextoChatTexto.push({role: 'ai', text: primeiraPerguntaText});

            const mensagemSistemaHTML = `
                <div class="font-bold mb-2">📋 Análise de Refinamento: <span class="text-blue-700">${item}</span></div>
                Para chegarmos à classificação perfeita, vamos por partes.<br><br>
                <strong>1. Primeiro: este item é um serviço ou um produto material?</strong>
            `;
            
            h.innerHTML += `<div class="bg-blue-50 text-blue-900 border border-blue-200 p-4 rounded-xl self-start max-w-[90%] text-sm leading-relaxed shadow-sm">${mensagemSistemaHTML}</div>`;
            h.scrollTop = h.scrollHeight;
            
            const input = document.getElementById('inputChat');
            input.focus();
        }

        async function enviarChat() {
            const input = document.getElementById('inputChat');
            const txt = input.value.trim();
            if (!txt) return;

            const h = document.getElementById('chatHistory');
            h.innerHTML += `<div class="bg-blue-600 text-white p-3 rounded-xl self-end ml-auto max-w-[85%] shadow-sm leading-relaxed whitespace-pre-line">${txt}</div>`;
            input.value = "";
            h.scrollTop = h.scrollHeight;

            const tempId = "msg-" + Date.now();
            h.innerHTML += `<div id="${tempId}" class="bg-slate-200 p-3 rounded-xl self-start max-w-[85%] text-slate-500 italic flex items-center gap-2"><span class="animate-bounce">●</span> Analisando diretrizes contábeis...</div>`;
            h.scrollTop = h.scrollHeight;

            contextoChatTexto.push({ role: 'user', text: txt });

            let logConversaIA = contextoChatTexto.map(msg => `${msg.role === 'user' ? 'Usuário' : 'Consultor'}: ${msg.text}`).join('\n\n');

            const res = await chamarAPI(logConversaIA, 'duvida');
            
            document.getElementById(tempId).outerHTML = `<div class="bg-slate-100 text-slate-800 border border-slate-200 p-4 rounded-xl self-start max-w-[90%] leading-relaxed shadow-sm whitespace-pre-line">${res}</div>`;
            h.scrollTop = h.scrollHeight;

            if (!res.startsWith("Falha de comunicação")) {
                contextoChatTexto.push({ role: 'ai', text: res });
            } else {
                contextoChatTexto.pop();
            }
        }

        async function toggleExemplos(conta) {
            const id = `exemplos-${conta.replace(/[^a-zA-Z0-9]/g, '_')}`;
            const div = document.getElementById(id);
            
            div.classList.toggle('hidden');
            
            if (!div.classList.contains('hidden') && !cacheExemplos[conta]) {
                div.innerHTML = "<span class='text-blue-500 animate-pulse'>Buscando exemplos na base de dados da IA...</span>";
                const exemplos = await chamarAPI(conta, 'exemplo');
                cacheExemplos[conta] = exemplos;
                div.innerHTML = exemplos.replace(/\n/g, '<br>');
            }
        }

        function renderPlano() {
            const container = document.getElementById('planoContas');
            planoDeContas.forEach((m, index) => {
                const div = document.createElement('div');
                div.className = "border border-slate-200 rounded-xl mb-3 overflow-hidden shadow-sm transition-colors hover:border-blue-200";
                
                div.innerHTML = `
                    <button onclick="document.getElementById('modulo-${index}').classList.toggle('hidden')" class="w-full text-left p-4 bg-slate-50 font-bold text-sm text-blue-900 hover:bg-blue-50 flex justify-between items-center transition-colors">
                        ${m.modulo} <span class="text-xs opacity-60">▼</span>
                    </button>
                    <div id="modulo-${index}" class="hidden p-4 bg-white border-t border-slate-100 text-sm">
                        <ul class="space-y-3">
                            ${m.contas.map(c => `
                                <li>
                                    <button onclick="toggleExemplos('${c.replace(/'/g, "\\'")}')" class="text-slate-700 hover:text-blue-600 w-full text-left font-medium transition-colors flex items-start gap-2">
                                        <span class="text-blue-300 mt-0.5">•</span> <span>${c}</span>
                                    </button>
                                    <div id="exemplos-${c.replace(/[^a-zA-Z0-9]/g, '_')}" class="hidden pl-5 mt-2 text-slate-600 text-xs border-l-2 border-blue-100 ml-1 py-1 leading-relaxed"></div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
                container.appendChild(div);
            });
        }
        
        renderPlano();
    </script>
</body>
</html>
